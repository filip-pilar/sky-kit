<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sky-kit playground</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #sky{position:fixed;inset:0}
  #panel{position:fixed;top:12px;right:12px;z-index:5;width:240px;background:rgba(14,34,70,.72);color:#eef4ff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:10px 12px;font-size:12px}
  #panel{max-height:calc(100vh - 24px);overflow:auto;box-sizing:border-box}
  #panel.hidden{display:none}
  .r{display:grid;grid-template-columns:1fr auto;margin:5px 0}
  .r input[type=range],.r select{grid-column:1/3;width:100%;margin:0}
  .chk{display:flex;gap:6px;align-items:center;margin:5px 0}
  input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:4px 6px;border-radius:6px;border:0;margin:4px 0}
  button{font:inherit;margin:4px 4px 0 0;padding:4px 9px;border-radius:6px;border:0;cursor:pointer}
  .sec{margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.15);font-weight:600;opacity:.8}
  .hint{opacity:.6;margin-top:6px}
  .file input{display:block;width:100%;margin-top:4px;font:inherit;color:inherit}
  .head{display:flex;justify-content:space-between;align-items:center}
  .head button{margin:0;padding:2px 8px}
  #symbols{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
  #symbols button{margin:0;padding:4px 0;display:grid;place-items:center}
  #symbols svg{width:16px;height:16px}
  #state{margin-top:6px;min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #show{position:fixed;top:12px;right:12px;z-index:5;display:none}
  @media (max-width:520px){#panel{left:12px;width:auto;max-height:70vh}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="panel">
  <div class="head"><b>sky-kit playground</b><button id="hideBtn">Hide</button></div>
  <div class="r"><label>Speed</label><output id="o-speed"></output><input id="speed" type="range" min="0" max="4" step="0.05"></div>
  <div class="r"><label>Clouds</label><output id="o-coverage"></output><input id="coverage" type="range" min="0" max="1" step="0.01"></div>
  <div class="r"><label>Shadow</label><output id="o-shadow"></output><input id="shadow" type="range" min="0" max="1" step="0.01"></div>
  <div class="r"><label>Cloud size</label><output id="o-cloudScale"></output><input id="cloudScale" type="range" min="0.5" max="2" step="0.05"></div>
  <div class="r"><label>Fade to pale horizon</label><output id="o-gradient"></output><input id="gradient" type="range" min="0" max="1" step="0.01"></div>
  <div class="r"><label>Palette</label><span></span><select id="palette"><option>summer</option><option>day</option><option>pastel</option></select></div>
  <label class="chk"><input type="checkbox" id="planes" checked> Planes fly by</label>
  <button id="planeBtn">Fly a plane now</button>
  <div class="sec">Shapes</div>
  <input type="text" id="shapeText" value="hello, sky" aria-label="Words to form, separated by commas">
  <button id="textBtn">Form</button><button id="stopBtn">Stop</button>
  <label class="chk"><input type="checkbox" id="loop"> Loop the words</label>
  <div id="symbols" role="group" aria-label="Symbols"></div>
  <div id="state" aria-live="polite"></div>
  <div class="r"><label>Form (s)</label><output id="o-form"></output><input id="form" type="range" min="1" max="15" step="0.5" value="5"></div>
  <div class="r"><label>Hold (s)</label><output id="o-hold"></output><input id="hold" type="range" min="0" max="21" step="0.5" value="5"></div>
  <div class="r"><label>Melt (s)</label><output id="o-fade"></output><input id="fade" type="range" min="1" max="15" step="0.5" value="7"></div>
  <div class="r"><label>Pause between words (s)</label><output id="o-pause"></output><input id="pause" type="range" min="0" max="5" step="0.5" value="1"></div>
  <div class="r"><label>Density</label><output id="o-density"></output><input id="density" type="range" min="0" max="1" step="0.05" value="0.5"></div>
  <div class="r"><label>Size</label><output id="o-size"></output><input id="size" type="range" min="0.15" max="0.5" step="0.01" value="0.32"></div>
  <label class="file" style="display:block;margin-top:6px">Image / SVG silhouette <input type="file" id="file" accept="image/*"></label>
  <div class="hint">Commas chain words; pause 0 morphs one straight into the next; hold ∞ keeps it until Stop. H hides this panel.</div>
</div>
<button id="show">Controls</button>
<script type="module">
import { createSky, SKY_SYMBOLS, skySymbolSvg } from '../src/sky.js';
const sky = createSky(document.getElementById('sky'), { planes: true });
window.sky = sky;   // for trying things in the console

for (const k of ['speed', 'coverage', 'shadow', 'cloudScale', 'gradient']) {
  const inp = document.getElementById(k), out = document.getElementById('o-' + k);
  inp.value = sky.options[k]; out.textContent = (+inp.value).toFixed(2);
  inp.addEventListener('input', () => { out.textContent = (+inp.value).toFixed(2); sky.set({ [k]: +inp.value }); });
}
document.getElementById('palette').onchange = e => sky.set({ palette: e.target.value });
for (const k of ['planes']) document.getElementById(k).onchange = e => sky.set({ [k]: e.target.checked });
document.getElementById('planeBtn').onclick = () => sky.flyPlane();
// shapes: the timing, pause, density and size sliders apply to the next shape; Hold's last step means "until Stop"
const $ = id => document.getElementById(id), num = id => +$(id).value, FOREVER = 21;
const fmt = { form: v => v, hold: v => v >= FOREVER ? '∞' : v, fade: v => v, pause: v => v === 0 ? 'morph' : v, density: v => v.toFixed(2), size: v => v.toFixed(2) };
for (const [k, f] of Object.entries(fmt)) { const show = () => { $('o-' + k).textContent = f(num(k)); }; $(k).addEventListener('input', show); show(); }
const settings = () => ({ size: num('size'), form: num('form'), hold: num('hold') >= FOREVER ? Infinity : num('hold'), fade: num('fade'), density: num('density') });
let chain = [];
const queueWords = (words, first) => words.forEach((text, i) => sky.showShape({ text, ...settings(), queue: !(first && i === 0), pause: num('pause') }));
$('textBtn').onclick = () => {
  const words = $('shapeText').value.split(',').map(w => w.trim()).filter(Boolean);
  chain = words.length ? words : ['☁'];
  queueWords(chain, true);
};
$('stopBtn').onclick = () => { chain = []; sky.releaseShape(); };
for (const name of Object.keys(SKY_SYMBOLS)) {
  const b = document.createElement('button');
  b.title = b.ariaLabel = name; b.innerHTML = skySymbolSvg(name);
  b.onclick = () => { chain = []; sky.showShape({ symbol: name, ...settings(), size: num('size') * 1.2 }); };
  $('symbols').append(b);
}
$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  chain = [];
  const url = URL.createObjectURL(f);
  sky.showShape({ image: url, ...settings() }).finally(() => URL.revokeObjectURL(url));
};
setInterval(() => {
  const st = sky.shapeState;
  if ($('loop').checked && chain.length && !st.next.length && ['forming', 'holding', 'melting'].includes(st.phase)) queueWords(chain, false);
  $('state').textContent = st.phase === 'none' ? '' : st.phase + (st.label ? ' ' + st.label : '') + (st.next.length ? ' · next: ' + st.next.join(', ') : '');
}, 250);
const panel = document.getElementById('panel'), show = document.getElementById('show');
const setHidden = h => { panel.classList.toggle('hidden', h); show.style.display = h ? 'block' : 'none'; };
document.getElementById('hideBtn').onclick = () => setHidden(true);
show.onclick = () => setHidden(false);
if (matchMedia('(max-width: 520px)').matches) setHidden(true);   // phones: start with the sky visible
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'h' && e.target.tagName !== 'INPUT') setHidden(!panel.classList.contains('hidden')); });
</script>
</body>
</html>
