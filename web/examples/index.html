<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sky-kit demo</title>
<style>
  body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f9;color:#1d2b44}
  .hero{height:62vh;min-height:320px}
  .hero-text{position:absolute;left:32px;bottom:28px;color:#fff;text-shadow:0 2px 12px rgba(20,60,130,.35)}
  .hero-text h1{margin:0;font-size:40px}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
  .row{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0;align-items:flex-start}
  .card{width:300px;height:180px;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(20,50,100,.15)}
  .phone{width:180px;height:380px;border-radius:28px;overflow:hidden;box-shadow:0 8px 24px rgba(20,50,100,.2)}
  .banner{height:96px;border-radius:12px;overflow:hidden}
  .label{font-size:12px;opacity:.7;margin:4px 2px 0}
  #panel{position:fixed;top:12px;right:12px;z-index:5;width:230px;background:rgba(14,34,70,.72);color:#eef4ff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:10px 12px;font-size:12px}
  #panel .r{display:grid;grid-template-columns:1fr auto;margin:5px 0}
  #panel .r input,#panel .r select{grid-column:1/3;width:100%;margin:0}
  #panel button{font:inherit;margin:4px 4px 0 0;padding:3px 8px;border-radius:6px;border:0;cursor:pointer}
</style>
</head>
<body>
<div id="hero" class="hero"><div class="hero-text"><h1>Hello, sky</h1><div>One component, any container.</div></div></div>
<main>
  <p>The big sky is controlled by the panel. Below: the same component in other containers, each with its own settings.</p>
  <div class="row">
    <div><div id="card1" class="card"></div><div class="label">Card · sparse, slow</div></div>
    <div><div id="card2" class="card"></div><div class="label">Card · busy, drifting right, day palette</div></div>
    <div><div id="phone" class="phone"></div><div class="label">Phone shape · pastel</div></div>
  </div>
  <div id="banner" class="banner"></div><div class="label">Banner, full width × 96px</div>
</main>

<div id="panel">
  <b>Big sky</b>
  <div class="r"><label>Speed</label><output id="o-speed"></output><input id="speed" type="range" min="0" max="4" step="0.05"></div>
  <div class="r"><label>Clouds</label><output id="o-coverage"></output><input id="coverage" type="range" min="0" max="1" step="0.01"></div>
  <div class="r"><label>Shadow</label><output id="o-shadow"></output><input id="shadow" type="range" min="0" max="1" step="0.01"></div>
  <div class="r"><label>Cloud size</label><output id="o-cloudScale"></output><input id="cloudScale" type="range" min="0.5" max="2" step="0.05"></div>
  <div class="r"><label>Palette</label><span></span><select id="palette"><option>summer</option><option>day</option><option>pastel</option></select></div>
  <div class="r"><label>Direction</label><span></span><select id="direction"><option>left</option><option>right</option></select></div>
  <div class="r"><label>Quality</label><span></span><select id="quality"><option>high</option><option>balanced</option><option>low</option></select></div>
  <button id="seedBtn">New sky</button><button id="pauseBtn">Pause</button><button id="pngBtn">Save PNG</button>
</div>

<script type="module">
import { createSky } from '../src/sky.js';

const hero = createSky(document.getElementById('hero'));
createSky(document.getElementById('card1'), { coverage: 0.35, speed: 0.5, seed: 3 });
createSky(document.getElementById('card2'), { coverage: 0.8, speed: 2, direction: 'right', seed: 9, palette: 'day' });
createSky(document.getElementById('phone'), { seed: 42, palette: 'pastel' });
createSky(document.getElementById('banner'), { coverage: 0.55, seed: 17 });

for (const k of ['speed', 'coverage', 'shadow', 'cloudScale']) {
  const inp = document.getElementById(k), out = document.getElementById('o-' + k);
  inp.value = hero.options[k]; out.textContent = (+inp.value).toFixed(2);
  inp.addEventListener('input', () => { out.textContent = (+inp.value).toFixed(2); hero.set({ [k]: +inp.value }); });
}
for (const k of ['palette', 'direction', 'quality']) document.getElementById(k).onchange = e => hero.set({ [k]: e.target.value });
document.getElementById('seedBtn').onclick = () => hero.set({ seed: Math.floor(Math.random() * 1000) });
let paused = false;
document.getElementById('pauseBtn').onclick = e => { paused = !paused; paused ? hero.pause() : hero.play(); e.target.textContent = paused ? 'Play' : 'Pause'; };
document.getElementById('pngBtn').onclick = () => { const url = hero.snapshot(); if (!url) return; const a = document.createElement('a'); a.href = url; a.download = 'sky.png'; a.click(); };
</script>
</body>
</html>
